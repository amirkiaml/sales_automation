<svg width="760" height="380" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cold outreach workflow</title>
<desc>Three drafting agents write in parallel, a picker agent judges the winner, and a deterministic send delivers only the winning draft.</desc>
<defs>
  <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6C63E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#16875B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="30" y="30" width="200" height="64" rx="8" fill="#EDECFC" stroke="#6C63E8" stroke-width="1"/>
<text x="130" y="54" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#4A41C0">Professional agent</text>
<text x="130" y="72" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4A41C0">drafts an SMS</text>

<rect x="280" y="30" width="200" height="64" rx="8" fill="#EDECFC" stroke="#6C63E8" stroke-width="1"/>
<text x="380" y="54" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#4A41C0">Witty agent</text>
<text x="380" y="72" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4A41C0">drafts an SMS</text>

<rect x="530" y="30" width="200" height="64" rx="8" fill="#EDECFC" stroke="#6C63E8" stroke-width="1"/>
<text x="630" y="54" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#4A41C0">Executive agent</text>
<text x="630" y="72" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4A41C0">drafts an SMS</text>

<line x1="130" y1="94" x2="330" y2="150" stroke="#6C63E8" stroke-width="1.5" marker-end="url(#arrow1)"/>
<line x1="380" y1="94" x2="380" y2="150" stroke="#6C63E8" stroke-width="1.5" marker-end="url(#arrow1)"/>
<line x1="630" y1="94" x2="430" y2="150" stroke="#6C63E8" stroke-width="1.5" marker-end="url(#arrow1)"/>

<rect x="250" y="150" width="260" height="64" rx="8" fill="#E2F5EC" stroke="#16875B" stroke-width="1"/>
<text x="380" y="174" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#0F6E4A">Picker agent</text>
<text x="380" y="192" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#0F6E4A">judges all three, explains why</text>

<line x1="380" y1="214" x2="380" y2="270" stroke="#16875B" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="270" y="270" width="220" height="56" rx="8" fill="#EAEBE7" stroke="#B0B5B1" stroke-width="1"/>
<text x="380" y="292" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#3D3F3E">Twilio send</text>
<text x="380" y="310" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5B6169">winning draft only</text>

<text x="380" y="360" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6169">Purple = drafting agent · green = picker's decision · gray = deterministic code</text>
</svg>
