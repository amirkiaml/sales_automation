<svg width="760" height="610" viewBox="0 0 760 610" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Real system inbound reply workflow</title>
<desc>The poller checks Twilio for new messages, the triage agent classifies them, then either a compliance handler or a draft agent runs, followed directly by a human review step before anything sends.</desc>
<defs>
  <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8F8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6C63E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2563D9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="270" y="20" width="220" height="56" rx="8" fill="#EAEBE7" stroke="#B0B5B1" stroke-width="1"/>
<text x="380" y="42" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#3D3F3E">Poll Twilio API</text>
<text x="380" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5B6169">no webhook needed</text>
<line x1="380" y1="76" x2="380" y2="110" stroke="#8A8F8B" stroke-width="1.5" marker-end="url(#a1)"/>

<rect x="270" y="110" width="220" height="56" rx="8" fill="#EDECFC" stroke="#6C63E8" stroke-width="1"/>
<text x="380" y="132" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#4A41C0">Triage agent</text>
<text x="380" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4A41C0">classifies intent</text>

<line x1="320" y1="166" x2="255" y2="210" stroke="#6C63E8" stroke-width="1.5" marker-end="url(#a2)"/>
<line x1="440" y1="166" x2="530" y2="210" stroke="#6C63E8" stroke-width="1.5" marker-end="url(#a2)"/>

<rect x="120" y="210" width="220" height="56" rx="8" fill="#EAEBE7" stroke="#B0B5B1" stroke-width="1"/>
<text x="230" y="232" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#3D3F3E">Compliance handler</text>
<text x="230" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5B6169">STOP keywords, opts out</text>

<rect x="420" y="210" width="220" height="56" rx="8" fill="#EDECFC" stroke="#6C63E8" stroke-width="1"/>
<text x="530" y="232" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#4A41C0">Draft agent</text>
<text x="530" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4A41C0">suggests a reply</text>
<line x1="530" y1="266" x2="530" y2="300" stroke="#6C63E8" stroke-width="1.5" marker-end="url(#a2)"/>

<rect x="420" y="300" width="220" height="56" rx="8" fill="#E7EFFD" stroke="#2563D9" stroke-width="1"/>
<text x="530" y="322" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#1C4FAE">Human review</text>
<text x="530" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#1C4FAE">approve, edit, or discard</text>
<line x1="530" y1="356" x2="530" y2="390" stroke="#2563D9" stroke-width="1.5" marker-end="url(#a3)"/>

<rect x="420" y="390" width="220" height="56" rx="8" fill="#EAEBE7" stroke="#B0B5B1" stroke-width="1"/>
<text x="530" y="412" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#3D3F3E">Twilio send</text>
<text x="530" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5B6169">only after approval</text>

<rect x="30" y="470" width="700" height="70" rx="8" fill="#F2F3F0" stroke="#DBDFDC" stroke-width="1"/>
<text x="50" y="496" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6169">app/poll_inbound.py    app/agents/triage_agent.py    app/agents/draft_reply_agent.py</text>
<text x="50" y="518" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6169">app/review_pending.py + /admin/review    app/tools/twilio_sms.py</text>
<text x="380" y="565" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5B6169">Purple = LLM agent · gray = deterministic code · blue = human decision</text>
</svg>
