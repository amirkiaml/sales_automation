<svg width="760" height="470" viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Conversational agent workflow</title>
<desc>A visitor provides a business name and type, the draft agent opens with a sample cold text, then each reply is drafted with full conversation memory and classified by the triage agent, which can trigger a simulated human handoff.</desc>
<defs>
  <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6C63E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8F8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="270" y="20" width="220" height="56" rx="8" fill="#EAEBE7" stroke="#B0B5B1" stroke-width="1"/>
<text x="380" y="42" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#3D3F3E">Business name + type</text>
<text x="380" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5B6169">provided once, up front</text>
<line x1="380" y1="76" x2="380" y2="110" stroke="#8A8F8B" stroke-width="1.5" marker-end="url(#arrowG)"/>

<rect x="250" y="110" width="260" height="56" rx="8" fill="#EDECFC" stroke="#6C63E8" stroke-width="1"/>
<text x="380" y="132" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#4A41C0">Draft agent opens</text>
<text x="380" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4A41C0">writes a real sample cold text</text>
<line x1="380" y1="166" x2="380" y2="200" stroke="#6C63E8" stroke-width="1.5" marker-end="url(#arrowP)"/>

<rect x="270" y="200" width="220" height="56" rx="8" fill="#EAEBE7" stroke="#B0B5B1" stroke-width="1"/>
<text x="380" y="222" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#3D3F3E">You reply</text>
<text x="380" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5B6169">as the business owner</text>
<line x1="380" y1="256" x2="380" y2="290" stroke="#8A8F8B" stroke-width="1.5" marker-end="url(#arrowG)"/>

<rect x="220" y="290" width="320" height="56" rx="8" fill="#EDECFC" stroke="#6C63E8" stroke-width="1"/>
<text x="380" y="312" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#4A41C0">Draft agent replies</text>
<text x="380" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4A41C0">reads the full conversation history each turn</text>
<line x1="380" y1="346" x2="380" y2="380" stroke="#6C63E8" stroke-width="1.5" marker-end="url(#arrowP)"/>

<rect x="220" y="380" width="320" height="56" rx="8" fill="#EDECFC" stroke="#6C63E8" stroke-width="1"/>
<text x="380" y="402" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#4A41C0">Triage agent classifies</text>
<text x="380" y="420" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4A41C0">same classifier the real system uses</text>

<line x1="300" y1="436" x2="180" y2="460" stroke="#8A8F8B" stroke-width="1.5"/>
<line x1="460" y1="436" x2="580" y2="460" stroke="#2563D9" stroke-width="1.5"/>

<rect x="30" y="440" width="260" height="30" rx="15" fill="#EAEBE7" stroke="#B0B5B1" stroke-width="1"/>
<text x="160" y="459" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5B6169">↻ not urgent — keep chatting</text>

<rect x="470" y="440" width="260" height="30" rx="15" fill="#E7EFFD" stroke="#2563D9" stroke-width="1"/>
<text x="600" y="459" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#1C4FAE">hot lead → simulated handoff</text>
</svg>
